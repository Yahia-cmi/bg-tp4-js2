<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Etape 3 - Insertion à partir d'un tableau d'objets</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="table_container">
    <div class="table-wrapper">
      <table border="1">
        <thead>
          <tr>
            <th class="col_number">N°</th>
            <th class="col_text">Nom</th>
            <th class="col_text">Prénom</th>
            <th class="col_number">Points</th>
            <th class="col_chkbox">Select</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>

      <div class="btn-row">
        <button id="btnAdd" class="add-btn">Ajouter</button>
        <button id="btnConsole" class="add-btn">Console Tableau</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
